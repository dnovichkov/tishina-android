# JVM args for the Gradle daemon. UTF-8 keeps Cyrillic-aware messages stable on Windows.
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8 -XX:+UseG1GC

# Performance
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=warn

# AndroidX / Kotlin
android.useAndroidX=true
android.nonTransitiveRClass=true
android.defaults.buildfeatures.buildconfig=false
android.defaults.buildfeatures.resvalues=false
kotlin.code.style=official
kotlin.incremental=true
kotlin.daemon.jvmargs=-Xmx2g

# KSP
ksp.useKSP2=true

# Force Android Lint to use the K2-aware UAST backend.
# Without this, multiple lint detectors (ComposableFlowOperatorDetector, NonNullableMutableLiveDataDetector,
# ...) crash on AGP 8.7.3 + Kotlin 2.0.21 because they were compiled against K2 API while lint defaults
# to the K1 UAST — see https://issuetracker.google.com/issues/336842138.
android.lint.useK2Uast=true
