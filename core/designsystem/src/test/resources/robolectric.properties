# Pin Robolectric to API 33 by default. Robolectric 4.13 ships system images up to
# API 34; compileSdk = 35 (Android 15) is not yet bundled and DefaultSdkPicker
# would throw IllegalArgumentException. Tests do not need Android 15 stubs.
# Individual @Config(sdk = 31) cases (dynamic-color tests) override this per-class.
sdk=33
