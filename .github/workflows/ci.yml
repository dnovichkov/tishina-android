name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.workers.max=2 -Dkotlin.daemon.jvm.options=-Xmx2g"

jobs:
  static-checks:
    name: Static analysis (Detekt + Spotless + Lint)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/develop' }}

      - name: Detekt + Spotless + Lint (modules + build-logic)
        run: ./gradlew detektAll spotlessCheck lintDebug :build-logic:convention:detektAll :build-logic:convention:spotlessCheck --no-daemon --stacktrace

      - name: Upload Detekt reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: detekt-reports
          path: |
            **/build/reports/detekt/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-reports
          path: |
            **/build/reports/lint-results-*.html
            **/build/reports/lint-results-*.xml
          if-no-files-found: ignore
          retention-days: 14

  unit-tests:
    name: Unit tests + Roborazzi + Kover
    runs-on: ubuntu-latest
    needs: static-checks
    timeout-minutes: 40
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/develop' }}

      - name: Unit tests + Roborazzi verify + Kover XML
        run: ./gradlew :build-logic:convention:test :core:domain:test testDebugUnitTest verifyRoborazziDebug koverXmlReportDebug --no-daemon --stacktrace

      - name: Upload Roborazzi failure images
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: roborazzi-failure-images
          path: |
            **/build/outputs/roborazzi/
            **/build/reports/roborazzi/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Kover XML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kover-xml-report
          path: build/reports/kover/reportDebug.xml
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload unit-test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: |
            **/build/reports/tests/
            **/build/test-results/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload coverage to Codecov
        if: ${{ env.CODECOV_TOKEN != '' }}
        uses: codecov/codecov-action@v4
        with:
          token: ${{ env.CODECOV_TOKEN }}
          files: build/reports/kover/reportDebug.xml
          fail_ci_if_error: false

  build:
    name: Assemble debug APK + AAB
    runs-on: ubuntu-latest
    needs: static-checks
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/develop' }}

      # Phase 6 Task 8 — OSS licenses drift check. Re-runs `generateOssLicenses`
      # and fails the build if the committed JSON diverges from what the current
      # `releaseRuntimeClasspath` would produce. This catches the case where
      # a contributor bumps a dep but forgets to refresh the About-screen list.
      - name: Verify OSS licenses are up-to-date
        run: |
          ./gradlew :app:generateOssLicenses --no-daemon --no-configuration-cache
          if ! git diff --exit-code app/src/main/assets/oss_licenses.json; then
            echo "::error::app/src/main/assets/oss_licenses.json is out of date. Run './gradlew :app:generateOssLicenses' locally and commit the result."
            exit 1
          fi

      - name: Assemble debug APK and AAB
        run: ./gradlew :app:assembleDebug :app:bundleDebug --no-daemon --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload debug AAB
        uses: actions/upload-artifact@v4
        with:
          name: debug-aab
          path: app/build/outputs/bundle/debug/*.aab
          if-no-files-found: error
          retention-days: 14

  release-build:
    name: Assemble release APK + AAB (R8 smoke test)
    runs-on: ubuntu-latest
    needs: static-checks
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/develop' }}

      # Phase 6 Task 2 — smoke-test R8 + resource shrinking on every PR so a
      # missing keep-rule (Hilt / Compose / Room / kotlinx.serialization) is
      # caught before merge instead of after publishing. The release here is
      # signed with the bundled debug key — Phase 6 Task 6 adds the real
      # upload-key flow in a separate `release.yml` triggered by tag pushes.
      - name: Assemble release APK and AAB
        run: ./gradlew :app:assembleRelease :app:bundleRelease --no-daemon --stacktrace

      - name: Report release artifact sizes
        run: |
          set -euo pipefail
          echo "## Release artifact sizes" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          ls -la app/build/outputs/apk/release/*.apk | tee -a "$GITHUB_STEP_SUMMARY"
          ls -la app/build/outputs/bundle/release/*.aab | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk-unsigned
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload release AAB
        uses: actions/upload-artifact@v4
        with:
          name: release-aab-unsigned
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 14

      # mapping.txt is required to deobfuscate any crash report (Play Vitals,
      # bug reports, manual stack traces). Keep it as a CI artifact so we have
      # a usable mapping even for builds that never reach Play Console upload.
      - name: Upload R8 mapping.txt
        uses: actions/upload-artifact@v4
        with:
          name: release-mapping
          path: app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error
          retention-days: 90
