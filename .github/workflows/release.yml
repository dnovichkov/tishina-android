name: Release

# Phase 6 Task 6 — production release pipeline triggered exclusively by version
# tags (`v1.2.3`). The flow decodes the upload keystore from a GitHub Secret,
# builds R8-shrunk AAB + APK + mapping.txt, and publishes a *draft* GitHub
# Release so a maintainer can review the artefacts before flipping it public
# and uploading the AAB to Google Play / RuStore / Samsung.
on:
  push:
    tags:
      - 'v*.*.*'
  # `workflow_dispatch` lets a maintainer manually re-trigger the release flow
  # for a tag that already exists (useful if a transient runner failure killed
  # the first attempt). The job is idempotent on the artefact side, but the
  # GitHub Release step requires `--clobber` semantics from action-gh-release.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to (re-)release (e.g. v1.0.0)'
        required: true

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.workers.max=2 -Dkotlin.daemon.jvm.options=-Xmx2g"

jobs:
  build-and-release:
    name: Build signed AAB + APK and publish GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - name: Checkout (full history for release notes)
        uses: actions/checkout@v7
        with:
          # `softprops/action-gh-release` derives auto-generated notes from
          # commits between the previous and current tag — shallow clones drop
          # that information, so we ask for the full history.
          fetch-depth: 0
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: false

      - name: Resolve version from tag
        id: version
        run: |
          set -euo pipefail
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version_name=$VERSION" >> "$GITHUB_OUTPUT"
          # `github.run_number` monotonically increments per workflow run for
          # this repo, so each released build has a strictly increasing
          # versionCode even when the version tag is reused or rebuilt.
          echo "version_code=${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "Resolved tag=$TAG version=$VERSION versionCode=${{ github.run_number }}"

      - name: Decode upload keystore from secret
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${UPLOAD_KEYSTORE_BASE64:-}" ]; then
            echo "::error::UPLOAD_KEYSTORE_BASE64 secret is not configured."
            exit 1
          fi
          # Decode to the workspace root so it survives Gradle invocation but
          # outside of `app/` so it never ends up in `src/main/`.
          echo "$UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/tishina-upload-key.jks"
          echo "UPLOAD_KEYSTORE_PATH=$RUNNER_TEMP/tishina-upload-key.jks" >> "$GITHUB_ENV"

      - name: Assemble release APK + AAB (signed)
        env:
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
          UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
          UPLOAD_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
        run: ./gradlew :app:bundleRelease :app:assembleRelease --no-daemon --stacktrace

      - name: Report artifact sizes
        run: |
          set -euo pipefail
          echo "## Release artefacts (${{ steps.version.outputs.tag }})" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          ls -la app/build/outputs/apk/release/*.apk | tee -a "$GITHUB_STEP_SUMMARY"
          ls -la app/build/outputs/bundle/release/*.aab | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Stage release artefacts with friendly names
        run: |
          set -euo pipefail
          STAGE="$RUNNER_TEMP/release"
          mkdir -p "$STAGE"
          VERSION="${{ steps.version.outputs.version_name }}"
          cp app/build/outputs/apk/release/*.apk "$STAGE/tishina-${VERSION}.apk"
          cp app/build/outputs/bundle/release/*.aab "$STAGE/tishina-${VERSION}.aab"
          cp app/build/outputs/mapping/release/mapping.txt "$STAGE/tishina-${VERSION}-mapping.txt"
          ls -la "$STAGE"
          echo "RELEASE_STAGE=$STAGE" >> "$GITHUB_ENV"

      - name: Upload release artefacts as workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tishina-release-${{ steps.version.outputs.version_name }}
          path: ${{ env.RELEASE_STAGE }}/*
          if-no-files-found: error
          # 90 days matches the `release-mapping` retention in ci.yml — we may
          # need the mapping months after the build to deobfuscate late crashes.
          retention-days: 90

      - name: Create draft GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Tishina ${{ steps.version.outputs.version_name }}
          # Draft = release is created but unpublished; maintainer flips the
          # "Set as latest release" toggle after manually inspecting the AAB,
          # APK, and mapping in Play Console / RuStore / Samsung Galaxy Store.
          draft: true
          generate_release_notes: true
          files: |
            ${{ env.RELEASE_STAGE }}/tishina-${{ steps.version.outputs.version_name }}.aab
            ${{ env.RELEASE_STAGE }}/tishina-${{ steps.version.outputs.version_name }}.apk
            ${{ env.RELEASE_STAGE }}/tishina-${{ steps.version.outputs.version_name }}-mapping.txt

      - name: Remove decoded keystore from runner
        if: always()
        run: rm -f "$RUNNER_TEMP/tishina-upload-key.jks"
